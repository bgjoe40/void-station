<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void Station</title>
<link rel="preload" href="assets/fonts/neodgm.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ===== 메뉴 디자인 (menu.js가 그리는 HTML 덧씌움) — 어두운 우주 기지 + 주황 경보등 + 하늘색 단말기 ===== */
  /* 글꼴: Neo둥근모 (한글 픽셀 글꼴, SIL OFL) — 16px의 배수에서만 또렷함. 굵은 글꼴이 없어 모든 굵기에 같은 글꼴 (가짜 굵게 없이) */
  @font-face { font-family: 'NeoDunggeunmo'; src: url('assets/fonts/neodgm.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root {
    --bg: #04070b;
    --ink: #dfe7ec; --ink2: #aeb9c2; --dim: #76838f; --faint: #3f4a55;
    --acc: #ff7a2c; --acc2: #ffb35f; --acc-rgb: 255, 122, 44;
    --cy: #5ccfff; --cy-rgb: 92, 207, 255;
    --good: #7cf0a2; --bad: #ff5b4d; --gold: #ffd27a;
    --line: rgba(150, 182, 205, .14); --line2: rgba(150, 182, 205, .28);
    --f-ui: 'NeoDunggeunmo', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --f-disp: 'NeoDunggeunmo', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--f-ui); color: var(--ink); font-synthesis: none; }
  #game { display: block; cursor: none; }
  #overlay { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; color: var(--ink); font-family: var(--f-ui); }
  #overlay.hidden { display: none; }
  #overlay *, #overlay *::before, #overlay *::after { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus, .f { outline: none; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(150, 182, 205, .25); }

  /* --- 화면 (스크린) --- */
  .scr { position: absolute; inset: 0; animation: scrIn .32s cubic-bezier(.2, .7, .2, 1) backwards; }
  .scr.dim { background: radial-gradient(ellipse at 50% 45%, rgba(4, 7, 11, .55), rgba(2, 3, 6, .88)); backdrop-filter: blur(4px) saturate(.6); }
  .scr.solid { background: radial-gradient(ellipse at 50% 30%, #0c1219, #04070b 70%); }
  .center { display: flex; align-items: center; justify-content: center; padding: 22px 0 54px; }
  .center > .frm { max-height: 100%; display: flex; flex-direction: column; }
  .center > .frm > .bd { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .center > .frm > .hd, .center > .frm > .ft { flex: none; }
  @keyframes scrIn { from { opacity: 0; transform: translateY(10px) scale(.995); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateX(-18px); } }
  .fx-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 60% 50%, transparent 35%, rgba(0, 0, 0, .78) 100%); }
  .fx-scan { position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); }
  .fx-sweep { position: absolute; left: 0; right: 0; height: 160px; pointer-events: none; top: -160px;
    background: linear-gradient(180deg, transparent, rgba(var(--cy-rgb), .05), transparent); animation: sweep 9s linear infinite; }
  @keyframes sweep { to { top: 110%; } }
  .fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 50; }
  .fade.on { opacity: 1; pointer-events: all; }

  /* --- 글자 --- */
  .eye { font: 700 16px var(--f-ui); letter-spacing: .04em; color: var(--acc); }
  .eye.cy { color: var(--cy); }
  .h1 { font: 700 32px var(--f-ui); margin: 4px 0 0; letter-spacing: -.01em; }
  .muted { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }
  kbd { display: inline-block; min-width: 18px; padding: 2px 7px 3px; margin: 0 2px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px;
    background: linear-gradient(#1a222b, #10161d); color: var(--ink); font: 700 16px var(--f-ui); text-align: center; line-height: 16px; }

  /* --- 패널 (모서리 브래킷) --- */
  .frm { position: relative; background: linear-gradient(180deg, rgba(13, 19, 26, .95), rgba(6, 10, 14, .97)); border: 1px solid var(--line2);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .04); }
  .frm::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--acc), rgba(var(--acc-rgb), .15) 45%, transparent); }
  .frm::after { content: ''; position: absolute; inset: -5px; pointer-events: none;
    background: linear-gradient(var(--acc), var(--acc)) top left / 14px 2px no-repeat, linear-gradient(var(--acc), var(--acc)) top left / 2px 14px no-repeat,
                linear-gradient(var(--line2), var(--line2)) top right / 14px 1px no-repeat, linear-gradient(var(--line2), var(--line2)) top right / 1px 14px no-repeat,
                linear-gradient(var(--line2), var(--line2)) bottom left / 14px 1px no-repeat, linear-gradient(var(--line2), var(--line2)) bottom left / 1px 14px no-repeat,
                linear-gradient(var(--acc), var(--acc)) bottom right / 14px 2px no-repeat, linear-gradient(var(--acc), var(--acc)) bottom right / 2px 14px no-repeat; }
  .hd { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; gap: 16px; }
  .hd .grow { flex: 1; }
  .bd { padding: 20px 28px; }
  .ft { padding: 14px 28px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .ft .note { margin-right: auto; color: var(--dim); font-size: 16px; }
  .scroll { overflow-y: auto; }

  /* --- 단추 --- */
  .btn { position: relative; padding: 11px 22px; min-width: 120px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line2); color: var(--ink2);
    font: 16px var(--f-disp); letter-spacing: .02em; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
  .btn:focus, .btn:hover:not(:disabled), .btn.f { color: #fff; border-color: rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .08); }
  .btn.pri { background: linear-gradient(180deg, rgba(var(--acc-rgb), .28), rgba(var(--acc-rgb), .12)); border-color: rgba(var(--acc-rgb), .7); color: #ffe7d6; }
  .btn.pri:focus, .btn.pri:hover:not(:disabled), .btn.pri.f { background: linear-gradient(180deg, rgba(var(--acc-rgb), .5), rgba(var(--acc-rgb), .24)); border-color: var(--acc); box-shadow: 0 0 24px rgba(var(--acc-rgb), .35); }
  .btn.danger { border-color: rgba(255, 91, 77, .55); color: #ffc9c3; }
  .btn.danger:focus, .btn.danger:hover:not(:disabled), .btn.danger.f { background: rgba(255, 91, 77, .2); border-color: var(--bad); box-shadow: 0 0 20px rgba(255, 91, 77, .3); }
  .btn:disabled { opacity: .35; }
  .btn .k { margin-left: 8px; opacity: .6; }

  /* --- 타이틀 --- */
  .title { overflow: hidden; }
  .title .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3, 5, 8, .92) 0%, rgba(3, 5, 8, .72) 32%, rgba(3, 5, 8, .12) 62%, rgba(3, 5, 8, .35) 100%); }
  .title .shade2 { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3, 5, 8, .55), transparent 22%, transparent 72%, rgba(3, 5, 8, .9)); }
  .t-col { position: absolute; left: clamp(28px, 6.5vw, 120px); top: clamp(26px, 9vh, 110px); bottom: 70px; width: min(520px, 46vw); display: flex; flex-direction: column; }
  .logo { width: min(520px, 46vw); display: block; filter: drop-shadow(0 6px 24px rgba(255, 90, 30, .35)); animation: glitch 7s infinite steps(1); margin-left: -10px; }
  @keyframes glitch {
    0%, 96%, 100% { transform: none; filter: drop-shadow(0 6px 24px rgba(255, 90, 30, .35)); }
    96.5% { transform: translate(4px, -1px) skewX(-6deg); filter: drop-shadow(-3px 0 0 rgba(92, 207, 255, .8)) drop-shadow(3px 0 0 rgba(255, 50, 50, .8)); }
    97.2% { transform: translate(-3px, 1px); filter: drop-shadow(3px 0 0 rgba(92, 207, 255, .7)) drop-shadow(-2px 0 0 rgba(255, 50, 50, .7)); }
    97.8% { transform: none; }
  }
  .tag { margin: 6px 0 0 4px; color: var(--ink2); font-size: 16px; letter-spacing: .02em; }
  .tag .eye { margin-right: 10px; }
  .mm { margin-top: clamp(22px, 5vh, 46px); display: flex; flex-direction: column; gap: 2px; }
  .mi { position: relative; display: flex; align-items: center; gap: 16px; width: 100%; max-width: 440px; padding: 11px 18px 11px 22px; border: 0; background: transparent;
    color: var(--ink2); text-align: left; transition: transform .18s cubic-bezier(.2, .7, .2, 1), color .15s, background .15s; animation: rise .45s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 55ms + 120ms); }
  .mi::before { content: ''; position: absolute; left: 0; top: 50%; width: 3px; height: 0; background: var(--acc); box-shadow: 0 0 12px var(--acc); transform: translateY(-50%); transition: height .18s; }
  .mi .lb { flex: 1; min-width: 0; }
  .mi .t { font: 700 32px var(--f-ui); letter-spacing: -.01em; }
  .mi:focus, .mi.f { color: #fff; transform: translateX(12px); background: linear-gradient(90deg, rgba(var(--acc-rgb), .2), rgba(var(--acc-rgb), .04) 60%, transparent); }
  .mi:focus::before, .mi.f::before { height: 64%; }
  .mi:disabled { opacity: .3; }
  .mi .sub { display: block; font: 16px var(--f-ui); color: var(--dim); margin-top: 3px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi:focus .sub, .mi.f .sub { color: var(--ink2); }
  .t-side { position: absolute; right: clamp(24px, 4vw, 70px); bottom: 74px; width: min(360px, 32vw); animation: fadeIn .8s .4s backwards; }
  .t-card { padding: 16px 18px; }
  .t-card + .t-card { margin-top: 12px; }
  .t-card .row { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; color: var(--ink2); margin-top: 6px; }
  .t-card .row b { color: var(--ink); font-weight: 600; }
  .t-card .big { font: 16px var(--f-disp); margin-top: 6px; }
  .meter { height: 4px; background: rgba(255, 255, 255, .07); margin-top: 6px; position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v, 0) * 100%); background: linear-gradient(90deg, var(--acc), var(--acc2)); }
  .meter.cy i { background: linear-gradient(90deg, #2c9bd1, var(--cy)); }
  .t-foot { position: absolute; left: clamp(28px, 6.5vw, 120px); right: clamp(24px, 4vw, 70px); bottom: 22px; display: flex; align-items: center; gap: 22px; color: var(--dim); font-size: 16px; }
  .t-foot .keys-h { margin-left: auto; display: flex; gap: 18px; }
  .t-foot .ver { font: 600 16px var(--f-ui); letter-spacing: .1em; color: var(--faint); }

  /* 낮은 화면: 타이틀을 촘촘하게 */
  @media (max-height: 780px) {
    .t-col { top: 18px; bottom: 54px; }
    .logo { width: min(400px, 40vw); }
    .mm { margin-top: 14px; }
    .mi { padding: 7px 18px 7px 22px; }
    .mi .sub { display: none; }
    .t-side .t-card { padding: 12px 14px; }
    .t-side { bottom: 58px; }
  }
  @media (max-height: 660px) { .t-side .t-card + .t-card { display: none; } .tag { font-size: 16px; } }
  /* --- 시작 화면 (아무 키나) --- */
  .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .splash .logo { width: min(820px, 76vw); margin: 0; }
  .splash .tag { margin-top: 14px; font: 16px var(--f-disp); }
  .press { margin-top: 9vh; font: 16px var(--f-disp); letter-spacing: .1em; color: var(--ink); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .load { margin-top: 9vh; width: 320px; }
  .load .meter { height: 3px; }
  .load .meter i { width: 40%; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { from { left: -40%; } to { left: 100%; } }
  .load .muted { margin-top: 10px; font: 600 16px var(--f-ui); letter-spacing: .05em; }

  /* --- 힌트 줄 --- */
  .hints { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 20px; color: var(--dim); font-size: 16px; white-space: nowrap; pointer-events: none; }
  .title .hints { left: auto; right: clamp(24px, 4vw, 70px); transform: none; bottom: 22px; }

  /* --- 탭 --- */
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 9px 18px; background: transparent; border: 1px solid transparent; border-bottom: 2px solid transparent; color: var(--dim); font: 600 16px var(--f-ui); }
  .tab:focus, .tab:hover, .tab.f { color: var(--ink); background: rgba(255, 255, 255, .04); }
  .tab.on { color: #fff; border-bottom-color: var(--acc); background: linear-gradient(180deg, transparent, rgba(var(--acc-rgb), .1)); }
  .tab.on .e { color: var(--acc); opacity: 1; }

  /* --- 설정 줄 (슬라이더·스위치) --- */
  .opt { display: grid; grid-template-columns: 230px 1fr 64px; align-items: center; gap: 18px; width: 100%; padding: 13px 16px; border: 1px solid transparent; background: transparent; color: var(--ink); text-align: left; transition: background .15s, border-color .15s; }
  .opt + .opt { border-top-color: var(--line); }
  .opt:focus, .opt:hover, .opt.f { background: rgba(255, 255, 255, .04); border-color: var(--line2); }
  .opt .lbl { font-weight: 600; }
  .opt .lbl small { display: block; color: var(--dim); font-weight: 400; font-size: 16px; margin-top: 3px; }
  .opt .val { text-align: right; font: 16px var(--f-disp); color: var(--ink); }
  .opt:focus .val, .opt.f .val { color: var(--acc2); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(90deg, var(--acc) 0 calc(var(--v) * 100%), rgba(255, 255, 255, .1) calc(var(--v) * 100%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; background: #fff; border: 2px solid var(--acc); transform: rotate(45deg); box-shadow: 0 0 10px rgba(var(--acc-rgb), .6); }
  .sw { justify-self: start; width: 46px; height: 22px; border: 1px solid var(--line2); background: rgba(255, 255, 255, .06); position: relative; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: var(--dim); transition: left .18s, background .18s; }
  .opt.on .sw { background: rgba(var(--acc-rgb), .3); border-color: var(--acc); }
  .opt.on .sw::after { left: 27px; background: #fff; box-shadow: 0 0 10px var(--acc); }
  .opt.act { grid-template-columns: 230px 1fr auto; }
  .sect { margin: 20px 0 6px; font: 700 16px var(--f-ui); letter-spacing: .04em; color: var(--dim); }
  .sect:first-child { margin-top: 0; }

  /* --- 저장 슬롯 카드 --- */
  .slots { display: flex; flex-direction: column; gap: 10px; }
  .sl { position: relative; display: grid; grid-template-columns: 74px 1fr auto; gap: 18px; align-items: center; width: 100%; padding: 16px 20px; text-align: left;
    background: linear-gradient(90deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .01)); border: 1px solid var(--line); transition: background .15s, border-color .15s, transform .15s; }
  .sl:focus, .sl:hover:not(:disabled), .sl.f { border-color: rgba(var(--acc-rgb), .7); background: linear-gradient(90deg, rgba(var(--acc-rgb), .14), rgba(var(--acc-rgb), .02)); transform: translateX(4px); }
  .sl .no { font: 48px var(--f-disp); color: var(--faint); line-height: 1; }
  .sl:focus .no, .sl.f .no { color: var(--acc); }
  .sl .no small { display: block; font: 600 16px var(--f-ui); letter-spacing: .04em; margin-top: 4px; }
  .sl .t1 { font: 16px var(--f-disp); color: var(--ink); }
  .sl .t2 { margin-top: 6px; color: var(--ink2); font-size: 16px; display: flex; gap: 14px; flex-wrap: wrap; }
  .sl .t2 b { color: var(--ink); font-weight: 700; }
  .sl .when { text-align: right; color: var(--dim); font-size: 16px; }
  .sl .when b { display: block; color: var(--ink2); font: 16px var(--f-disp); margin-bottom: 3px; }
  .sl.empty { grid-template-columns: 74px 1fr; color: var(--faint); }
  .sl.empty .t1 { color: var(--dim); font-weight: 600; }
  .pips { display: flex; gap: 4px; margin-top: 9px; }
  .pips i { width: 22px; height: 5px; background: rgba(255, 255, 255, .08); }
  .pips i.v { background: rgba(var(--acc-rgb), .55); }
  .pips i.c { background: var(--acc); box-shadow: 0 0 8px rgba(var(--acc-rgb), .7); }
  .badge { display: inline-block; padding: 2px 8px; margin-left: 8px; border: 1px solid var(--line2); font: 600 16px var(--f-ui); color: var(--ink2); vertical-align: 3px; }
  .badge.easy { color: var(--good); border-color: rgba(124, 240, 162, .4); }
  .badge.normal { color: var(--gold); border-color: rgba(255, 210, 122, .4); }
  .badge.hard { color: var(--bad); border-color: rgba(255, 91, 77, .45); }
  .sl-wrap { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .del { width: 52px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); color: var(--dim); font-size: 16px; }
  .del:focus, .del:hover, .del.f { color: #ffc9c3; border-color: var(--bad); background: rgba(255, 91, 77, .15); }
  .log { margin: 0; padding: 0; list-style: none; font-size: 16px; color: var(--dim); }
  .log li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .log li b { color: var(--ink2); font: 700 16px var(--f-ui); min-width: 82px; }
  .log li.clear { color: var(--gold); }

  /* --- 난이도 카드 --- */
  .dcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dc { position: relative; padding: 0 0 18px; text-align: left; background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .01)); border: 1px solid var(--line);
    transition: transform .18s, border-color .15s, background .15s, box-shadow .15s; overflow: hidden; }
  .dc:focus, .dc:hover, .dc.f { transform: translateY(-4px); border-color: rgba(var(--acc-rgb), .8); box-shadow: 0 18px 40px rgba(0, 0, 0, .5), 0 0 30px rgba(var(--acc-rgb), .18); background: linear-gradient(180deg, rgba(var(--acc-rgb), .12), rgba(255, 255, 255, .01)); }
  .dc .art { height: 150px; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(ellipse at 50% 85%, rgba(var(--acc-rgb), .18), transparent 65%); border-bottom: 1px solid var(--line); }
  .dc .art img { height: 120px; image-rendering: pixelated; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .6)); }
  .dc .nm { padding: 14px 18px 0; font: 700 32px var(--f-ui); }
  .dc .eye { padding: 0 18px; display: block; margin-top: 2px; }
  .dc p { margin: 10px 18px 0; color: var(--ink2); font-size: 16px; line-height: 1.55; min-height: 40px; }
  .dc .stat { display: grid; grid-template-columns: 70px 1fr 42px; gap: 10px; align-items: center; margin: 10px 18px 0; font-size: 16px; color: var(--dim); }
  .dc .stat b { text-align: right; font: 700 16px var(--f-ui); color: var(--ink2); }
  .dc .rec { position: absolute; top: 12px; right: 12px; padding: 3px 8px; background: var(--acc); color: #1a0a02; font: 700 16px var(--f-ui); }

  /* --- 조작법·가이드 --- */
  .kgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .kgroup .eye { display: block; margin-bottom: 10px; }
  .krow { display: grid; grid-template-columns: 148px 1fr; gap: 12px; align-items: start; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--ink2); }
  .krow .keys { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 3px; }
  .krow .keys kbd { margin: 0; }
  .krow small { color: var(--dim); display: block; margin-top: 2px; }
  .guide { display: grid; grid-template-columns: 250px 1fr; gap: 20px; min-height: 0; }
  .glist { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; padding-right: 6px; }
  .gi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid transparent; background: transparent; color: var(--ink2); text-align: left; font-size: 16px; }
  .gi img { width: 28px; height: 28px; object-fit: contain; image-rendering: pixelated; }
  .gi:focus, .gi:hover, .gi.f { color: #fff; background: rgba(255, 255, 255, .05); border-color: var(--line2); }
  .gi.on { color: #fff; background: linear-gradient(90deg, rgba(var(--acc-rgb), .2), transparent); border-color: rgba(var(--acc-rgb), .5); }
  .gdet { border-left: 1px solid var(--line); padding-left: 22px; overflow-y: auto; }
  .gdet .gh { display: flex; align-items: center; gap: 16px; }
  .gdet .gh img { width: 64px; height: 64px; object-fit: contain; image-rendering: pixelated; background: radial-gradient(circle, rgba(var(--acc-rgb), .16), transparent 70%); }
